&lt;script&gt;
/* Ideal interference-filter model. No optical aberrations, material losses,
 * detector response, photon noise, or atmospheric attenuation are included.
 * All spectrum weights are supplied/illustrative, not an M42 measurement.
 */
(function (root) {
  &#x27;use strict&#x27;;
  const LN2 = Math.LN2;
  const EW_FACTOR = 3.625609908221908 / (4 * Math.pow(LN2, 0.25));
  const DEG = Math.PI / 180;
  const DEFAULT_LINES = Object.freeze([
    { name: &#x27;Hβ&#x27;, wavelength: 486.133, weight: 1 },
    { name: &#x27;[O III] 4959&#x27;, wavelength: 495.891, weight: 1 },
    { name: &#x27;[O III] 5007&#x27;, wavelength: 500.7, weight: 3 },
    { name: &#x27;[N II] 6548&#x27;, wavelength: 654.805, weight: 0.15 },
    { name: &#x27;Hα&#x27;, wavelength: 656.28, weight: 2.86 },
    { name: &#x27;[N II] 6583&#x27;, wavelength: 658.345, weight: 0.45 },
    { name: &#x27;[S II] 6716&#x27;, wavelength: 671.644, weight: 0.1 },
    { name: &#x27;[S II] 6731&#x27;, wavelength: 673.082, weight: 0.1 }
  ]);
  const offsetCache = new Map();

  function finite(value, fallback) {
    return Number.isFinite(Number(value)) ? Number(value) : fallback;
  }

  function profile(delta, width) {
    const x = 2 * delta / width;
    return Math.abs(x) &gt; 5 ? 0 : Math.exp(-LN2 * x * x * x * x);
  }

  function geometry(config) {
    const c = config || {};
    const position = c.position || &#x27;rear&#x27;;
    const telescopeF = Math.max(0.51, finite(c.telescopeF, finite(c.fNumber, 4)));
    const eyepieceFocal = Math.max(1, finite(c.eyepieceFocal, 55));
    const nvFocal = Math.max(1, finite(c.nvFocal, 26));
    const nvF = Math.max(0.51, finite(c.nvF, 1.2));
    const fNumber = Math.max(0.51, finite(c.fNumber, 1.2));
    const afocal = position.startsWith(&#x27;afocal&#x27;) || c.afocal === true;
    const finalF = afocal ? Math.max(nvF, telescopeF * nvFocal / eyepieceFocal) : fNumber;
    // A downstream NV entrance pupil can clip an oversized telescope exit pupil.
    // In that case only the retained central part of the telescope pupil reaches
    // the image, including photons filtered BEFORE the eyepiece.
    const effectiveEntranceF = afocal ? Math.max(telescopeF, eyepieceFocal / (nvFocal / nvF)) : fNumber;
    let mode = &#x27;cone&#x27;;
    let localF = fNumber;
    let angleSemantics = &#x27;chief-ray angle at the filter; zero for ideal image-space telecentric rear placement&#x27;;
    if (position === &#x27;front&#x27; || position === &#x27;afocalBetween&#x27; || position === &#x27;afocalFront&#x27;) {
      mode = &#x27;parallel&#x27;;
      localF = Infinity;
      angleSemantics = position === &#x27;afocalBetween&#x27;
        ? &#x27;eyepiece OUTPUT angle at the NV objective; NOT true sky angle&#x27;
        : &#x27;true sky angle relative to the front-filter normal&#x27;;
    } else if (position === &#x27;afocalBefore&#x27;) localF = effectiveEntranceF;
    else if (position === &#x27;afocalAfter&#x27;) localF = finalF;
    else if (position === &#x27;ideal&#x27;) { mode = &#x27;ideal&#x27;; localF = Infinity; }
    if (c.mode) mode = c.mode;
    if (c.beamF !== undefined) {
      localF = Number(c.beamF);
      if (c.mode !== &#x27;ideal&#x27;) mode = Number.isFinite(localF) ? &#x27;cone&#x27; : &#x27;parallel&#x27;;
    }
    if (mode === &#x27;cone&#x27; &amp;&amp; !(localF &gt; 0.5)) throw new RangeError(&#x27;beamF must be greater than 0.5.&#x27;);
    const sensorRadius = Math.max(0, finite(c.sensorRadius, 9));
    const focalLength = Math.max(0.01, finite(c.focalLength, 25));
    const defaultEdge = Math.atan(sensorRadius / (position === &#x27;afocalBetween&#x27; ? nvFocal : focalLength)) / DEG;
    return {
      position, mode, beamF: localF, filterFNumber: localF,
      imageFNumber: finalF, finalF, effectiveEntranceF, telescopeF, eyepieceFocal, nvFocal, nvF,
      edgeAngleDeg: finite(c.edgeAngleDeg, defaultEdge),
      angleSemantics,
      pupilFilledDiameter: afocal ? Math.min(nvFocal / nvF, eyepieceFocal / telescopeF) : null
    };
  }

  function coneQ(fNumber, nEff, sampleCount) {
    const n = Math.max(32, Math.round(sampleCount || 192));
    const a = 1 / (4 * fNumber * fNumber * nEff * nEff);
    const q = new Float64Array(n);
    for (let i = 0; i &lt; n; i++) q[i] = Math.sqrt(1 - a * (i + 0.5) / n);
    return q;
  }

  // width: FWHM in nm. Offset is the positive RED shift of the normal-incidence
  // passband. designF is intentionally independent of the actual optical beam.
  function optimizedOffset(width, designF, lineNm, nEff) {
    width = Math.max(0.01, finite(width, 7));
    designF = Math.max(0.51, finite(designF, 2));
    lineNm = finite(lineNm, 656.28);
    nEff = Math.max(1.01, finite(nEff, 2));
    const key = [width, designF, lineNm, nEff].join(&#x27;|&#x27;);
    if (offsetCache.has(key)) return offsetCache.get(key);
    const q = coneQ(designF, nEff, 384);
    const maxOffset = lineNm * (1 / Math.sqrt(1 - 1 / (4 * designF * designF * nEff * nEff)) - 1);
    function merit(offset) {
      let sum = 0;
      for (let i = 0; i &lt; q.length; i++) sum += profile(lineNm / q[i] - lineNm - offset, width);
      return sum / q.length;
    }
    // Coarse search followed by local golden-section refinement avoids any
    // assumption that a midpoint shift maximizes the actual pupil average.
    const steps = 80;
    let best = 0, bestValue = -1;
    for (let i = 0; i &lt;= steps; i++) {
      const x = maxOffset * i / steps, y = merit(x);
      if (y &gt; bestValue) { best = x; bestValue = y; }
    }
    let a = Math.max(0, best - maxOffset / steps);
    let b = Math.min(maxOffset, best + maxOffset / steps);
    const ratio = (Math.sqrt(5) - 1) / 2;
    let x1 = b - ratio * (b - a), x2 = a + ratio * (b - a);
    let y1 = merit(x1), y2 = merit(x2);
    for (let i = 0; i &lt; 38; i++) {
      if (y1 &lt; y2) { a = x1; x1 = x2; y1 = y2; x2 = a + ratio * (b - a); y2 = merit(x2); }
      else { b = x2; x2 = x1; y2 = y1; x1 = b - ratio * (b - a); y1 = merit(x1); }
    }
    const result = (a + b) / 2;
    offsetCache.set(key, result);
    return result;
  }

  function compile(config) {
    const c = config || {};
    const geo = geometry(c);
    const width = Math.max(0.01, finite(c.width, 7));
    const nEff = Math.max(1.01, finite(c.nEff, 2));
    const designF = Math.max(0.51, finite(c.designF, 2));
    const kind = String(c.filterKind || c.kind || &#x27;ha&#x27;).toLowerCase();
    const mainLines = kind === &#x27;dual&#x27; || kind === &#x27;dualband&#x27; ? [656.28, 500.7]
      : kind === &#x27;oiii&#x27; || kind === &#x27;o3&#x27; ? [500.7] : [656.28];
    const bands = mainLines.map((line, index) =&gt; {
      const offset = c.offsets &amp;&amp; c.offsets[index] !== undefined ? Number(c.offsets[index])
        : c.offset !== undefined ? Number(c.offset)
        : c.optimized === true ? optimizedOffset(width, designF, line, nEff) : 0;
      return { line, center: line + offset, offset, width };
    });
    const rawLines = c.lines || DEFAULT_LINES;
    const lines = rawLines.map(line =&gt; ({
      name: line.name || line.label || String(line.wavelength || line.nm),
      wavelength: finite(line.wavelength, finite(line.nm, 656.28)),
      weight: Math.max(0, finite(line.weight, finite(line.intensity, 1)))
    }));
    return { config: c, geo, width, nEff, designF, kind, bands, lines };
  }

  function incidenceQ(model, angleDeg) {
    const { config: c, geo, nEff } = model;
    if (geo.mode === &#x27;ideal&#x27;) return new Float64Array([1]);
    const alpha = finite(angleDeg, finite(c.angleDeg, 0)) * DEG;
    if (Math.abs(alpha) &gt;= Math.PI / 2) throw new RangeError(&#x27;Filter incidence angle must be less than 90 degrees.&#x27;);
    if (geo.mode === &#x27;parallel&#x27;) {
      return new Float64Array([Math.sqrt(1 - Math.sin(alpha) ** 2 / (nEff * nEff))]);
    }
    if (Math.abs(alpha) &lt; 1e-12) return coneQ(geo.beamF, nEff, c.pupilSamples);
    // Optional tilted cone. Default rear model uses angleDeg = 0 everywhere.
    const radialCount = Math.max(24, Math.round(finite(c.pupilSamples, 96)));
    const azimuthCount = Math.max(12, Math.round(finite(c.azimuthSamples, 24)));
    const qs = new Float64Array(radialCount * azimuthCount);
    let k = 0;
    for (let i = 0; i &lt; radialCount; i++) {
      const sinTheta = Math.sqrt((i + 0.5) / radialCount) / (2 * geo.beamF);
      const cosTheta = Math.sqrt(1 - sinTheta * sinTheta);
      for (let j = 0; j &lt; azimuthCount; j++) {
        const phi = 2 * Math.PI * (j + 0.5) / azimuthCount;
        const cosTotal = Math.cos(alpha) * cosTheta + Math.sin(alpha) * sinTheta * Math.cos(phi);
        qs[k++] = Math.sqrt(1 - (1 - cosTotal * cosTotal) / (nEff * nEff));
      }
    }
    return qs;
  }

  function throughputAtQ(wavelength, bands, qs, nominal) {
    let sum = 0;
    for (let i = 0; i &lt; qs.length; i++) {
      let atAngle = 0;
      for (const band of bands) {
        atAngle += profile(wavelength / qs[i] - (nominal ? band.line : band.center), band.width);
      }
      // The two supported bands are widely separated, so overlap is negligible.
      sum += Math.min(1, atAngle);
    }
    return sum / qs.length;
  }

  function evaluateModel(model, angleDeg) {
    const qs = incidenceQ(model, angleDeg);
    let qMean = 0;
    for (const q of qs) qMean += q;
    qMean /= qs.length;
    let totalWeight = 0, lineSignal = 0, nominalLineSignal = 0;
    let targetWeight = 0, targetSignal = 0;
    const perLine = model.lines.map(line =&gt; {
      const transmission = throughputAtQ(line.wavelength, model.bands, qs, false);
      const nominalTransmission = throughputAtQ(line.wavelength, model.bands, [1], true);
      const signal = line.weight * transmission;
      lineSignal += signal;
      nominalLineSignal += line.weight * nominalTransmission;
      totalWeight += line.weight;
      const isMain = model.bands.some(band =&gt; Math.abs(band.line - line.wavelength) &lt; 0.15);
      if (isMain) { targetWeight += line.weight; targetSignal += signal; }
      return { ...line, transmission, nominalTransmission, signal };
    });
    const equivalentWidth = qMean * model.bands.reduce((sum, band) =&gt; sum + EW_FACTOR * band.width, 0);
    const nominalEquivalentWidth = model.bands.reduce((sum, band) =&gt; sum + EW_FACTOR * band.width, 0);
    const imageF = model.geo.imageFNumber;
    const targetLineFraction = targetWeight &gt; 0 ? targetSignal / targetWeight
      : model.bands.reduce((sum, band) =&gt; sum + throughputAtQ(band.line, model.bands, qs, false), 0) / model.bands.length;
    return {
      angleDeg: finite(angleDeg, finite(model.config.angleDeg, 0)),
      geometry: model.geo,
      bands: model.bands,
      perLine,
      lineSignal,
      totalLines: lineSignal,
      allLineSignal: lineSignal,
      lineFraction: totalWeight ? lineSignal / totalWeight : 0,
      allLineFraction: totalWeight ? lineSignal / totalWeight : 0,
      targetLineFraction,
      nominalLineSignal,
      nominalRatio: nominalLineSignal &gt; 0 ? lineSignal / nominalLineSignal : 0,
      equivalentWidth,
      continuumEquivalentBandwidth: equivalentWidth,
      nominalEquivalentWidth,
      continuumFraction: equivalentWidth / nominalEquivalentWidth,
      lineToContinuum: lineSignal / equivalentWidth,
      contrastRatioToNominal: nominalLineSignal &gt; 0 ? (lineSignal / equivalentWidth) / (nominalLineSignal / nominalEquivalentWidth) : 0,
      imageLineBrightness: lineSignal / (imageF * imageF),
      imageContinuumBrightnessPerUnitSpectralDensity: equivalentWidth / (imageF * imageF),
      meanQ: qMean
    };
  }

  function evaluate(config) {
    return evaluateModel(compile(config));
  }

  function transmission(wavelength, config) {
    const model = compile(config);
    return throughputAtQ(wavelength, model.bands, incidenceQ(model), false);
  }

  // A reusable wavelength sampler avoids repeated offset optimization and pupil
  // construction when plotting a transmission curve.
  function createSampler(config) {
    const model = compile(config);
    const qs = incidenceQ(model);
    const fn = wavelength =&gt; throughputAtQ(wavelength, model.bands, qs, false);
    fn.bands = model.bands;
    fn.geometry = model.geo;
    return fn;
  }

  // LUT coordinate is incidence CHIEF-RAY ANGLE IN DEGREES, uniform 0..maxAngleDeg.
  // For front placement this is true sky angle; for afocalBetween it is the
  // magnified output angle. Rear optics are telecentric when maxAngleDeg = 0.
  // Callers choose where their target lies within this angular coordinate.
  function radialProfile(config, options) {
    const model = compile(config);
    const opts = typeof options === &#x27;number&#x27; ? { bins: options } : (options || {});
    const bins = Math.max(2, Math.round(finite(opts.bins, 256)));
    const maxAngleDeg = Math.max(0, finite(opts.maxAngleDeg,
      model.geo.mode === &#x27;cone&#x27; || model.geo.mode === &#x27;ideal&#x27; ? 0 : model.geo.edgeAngleDeg));
    const names = [&#x27;angleDeg&#x27;, &#x27;lineSignal&#x27;, &#x27;lineFraction&#x27;, &#x27;targetLineFraction&#x27;, &#x27;nominalRatio&#x27;,
      &#x27;equivalentWidth&#x27;, &#x27;contrastRatioToNominal&#x27;, &#x27;imageLineBrightness&#x27;,
      &#x27;imageContinuumBrightnessPerUnitSpectralDensity&#x27;];
    const output = { bins, maxAngleDeg, geometry: model.geo, bands: model.bands };
    for (const name of names) output[name] = new Float32Array(bins);
    output.perLine = model.lines.map(line =&gt; ({ ...line, transmission: new Float32Array(bins) }));
    let constant = null;
    for (let i = 0; i &lt; bins; i++) {
      const angleDeg = maxAngleDeg * i / (bins - 1);
      const result = constant || evaluateModel(model, angleDeg);
      if (maxAngleDeg === 0) constant = result;
      for (const name of names) output[name][i] = result[name];
      for (let j = 0; j &lt; model.lines.length; j++) output.perLine[j].transmission[i] = result.perLine[j].transmission;
    }
    output.totalLines = output.lineSignal;
    output.allLineSignal = output.lineSignal;
    output.continuumEquivalentBandwidth = output.equivalentWidth;
    output.nominalLineSignal = evaluateModel(model, 0).nominalLineSignal;
    return output;
  }

  function lookup(profileData, name, angleDeg) {
    const array = profileData[name];
    if (!array) throw new Error(&#x27;Unknown profile quantity: &#x27; + name);
    if (profileData.maxAngleDeg === 0) return array[0];
    const x = Math.min(array.length - 1, Math.max(0, Math.abs(angleDeg) / profileData.maxAngleDeg * (array.length - 1)));
    const i = Math.floor(x), j = Math.min(i + 1, array.length - 1), t = x - i;
    return array[i] * (1 - t) + array[j] * t;
  }

  const api = {
    version: &#x27;1.0.0&#x27;, DEFAULT_LINES, EW_FACTOR,
    profile, geometry, optimizedOffset, transmission, createSampler,
    evaluate, radialProfile, lookup
  };
  root.M42Optics = api;
  if (typeof module !== &#x27;undefined&#x27; &amp;&amp; module.exports) module.exports = api;
})(typeof window !== &#x27;undefined&#x27; ? window : globalThis);

&lt;script&gt;
/* Rectilinear ideal imaging on an 18 mm circular photocathode.
 * The M42 template always spans 0.5005 degrees on the sky.
 * The afocal mapping uses ideal paraxial angular magnification in tangent space.
 */
(function(root){
  &#x27;use strict&#x27;;
  const DEG=Math.PI/180,RADIUS=9,FIELD=.5005;
  function geometry(c){
    const afocal=c.position.startsWith(&#x27;afocal&#x27;);
    const magnification=afocal?600/c.eyepieceFocal:1;
    const focal=afocal?magnification*c.nvFocal:c.focalLength;
    const angleFocal=afocal?c.nvFocal:focal;
    return {afocal,magnification,focal,angleFocal,radius:RADIUS,
      halfSky:Math.atan(RADIUS/focal)/DEG,halfControl:Math.atan(RADIUS/angleFocal)/DEG};
  }
  function projection(c){
    const g=geometry(c),a=(c.targetAngle||0)*DEG;
    const sky=g.afocal?Math.atan(Math.tan(a)/g.magnification):a;
    const sin=Math.sin(sky),cos=Math.cos(sky);
    return function(dxDeg,dyDeg){
      const u=Math.tan(dxDeg*DEG),v=Math.tan(dyDeg*DEG),z=cos-sin*u;
      const x=g.focal*(cos*u+sin)/z,y=g.focal*v/z,r=Math.hypot(x,y);
      return {x,y,r,inside:z&gt;0&amp;&amp;r&lt;=RADIUS,angle:Math.atan(r/g.angleFocal)/DEG};
    };
  }
  function target(c){
    const project=projection(c),center=project(0,0);
    const corners=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([x,y])=&gt;project(x*FIELD/2,y*FIELD/2));
    return {center,corners};
  }
  function unprojection(c){
    const g=geometry(c),a=(c.targetAngle||0)*DEG;
    const sky=g.afocal?Math.atan(Math.tan(a)/g.magnification):a;
    const sin=Math.sin(sky),cos=Math.cos(sky);
    return function(x,y){
      const u=x/g.focal,v=y/g.focal,z=sin*u+cos;
      return {dx:Math.atan((cos*u-sin)/z)/DEG,dy:Math.atan(v/z)/DEG};
    };
  }
  const api={geometry,projection,unprojection,target,FIELD,RADIUS};
  root.M42Field=api;
  if(typeof module!==&#x27;undefined&#x27;&amp;&amp;module.exports)module.exports=api;
})(typeof window!==&#x27;undefined&#x27;?window:globalThis);

&lt;script&gt;
(function(){
  &#x27;use strict&#x27;;
  const root=document.getElementById(&#x27;m42-filter-lab&#x27;);
  const help={
    focal:[&#x27;焦距与焦比：两个不同的量&#x27;,&#x27;25 mm、85 mm 等是焦距。对同一块18 mm阴极，焦距短就能收进更宽的天区；焦距长则把同一天体成像得更大，但看到的范围更窄。&#x27;,&#x27;这里可选16、25、35、50、85、135、200、300 mm：都用同一个焦比滑块，比较的是理想镜头，未指定品牌或真实产品。比如25 mm F1.2与85 mm F1.2，焦距不同，焦比相同。&#x27;,&#x27;不同焦距模式中，左右分别选焦距；前后置和普通/优化模式中，一个焦距同时用于两边。无焦继续使用600 mm望远镜和26 mm夜视物镜，焦距对比选项暂不可用。&#x27;,&#x27;相同天区方向，在两片前置滤镜上的入射角相同；相同画面边缘，在短焦镜头里却对应更大的天区角度。差别主要来自“能看多宽”。&#x27;,&#x27;同焦比下，同一天体的理想面亮度不会只因换焦距而增加；长焦把像放大，会覆盖更多面积。本演示不加入分辨率、像差或噪声变化。&#x27;],
    fieldmap:[&#x27;全视场圆图看什么？&#x27;,&#x27;每个圆都代表直径18 mm的完整夜视阴极。圆的屏幕大小相同，但对应的天区大小取决于焦距：25 mm约39.6°，85 mm约12.1°。&#x27;,&#x27;选择“主线透过分布”时，圆内展示透过率，不是把M42照片铺满整个天空。灰度使用同一线性刻度：黑色0%，白色100%。它不随“固定曝光/统一天空亮度”改变。&#x27;,&#x27;Hα看656.3 nm主线，OIII看500.7 nm主线；双窄按输入强度对两条主线加权。中心和边缘百分比是这两处的透过率，不能把白色区域直接解释成真实夜视器一定能看见的范围。下方M42特写还包含邻近谱线，因此特写最亮的角度不一定等于圆图主线最亮的角度。&#x27;,&#x27;前置普通窄带常出现中心明亮、外圈变暗；预偏置优化片有时出现中间较暗、某一圈最亮。后置在本模型中为远心光锥，所以整个圆内的透过率均匀。&#x27;,&#x27;小框按真实角尺度标出M42特写的范围。它很小是正常的：特写只有约半度宽。框移到阴极之外时，相应镜头看不到这片天区。&#x27;,&#x27;选择“M42真实取景”时，把约半度的M42特写按实际角大小放进整个视场，周围仅用均匀天空填充；没有添加这张特写以外的星空数据。这一模式跟随曝光显示设置。25 mm里M42很小是正常的，可在下方看放大特写。&#x27;,&#x27;假设前置滤镜口径足够大、没有机械遮挡；不另外加入镜头暗角。&#x27;],
    crop:[&#x27;为什么下面两张星云看起来一样大？&#x27;,&#x27;下面是同一块约半度天区的放大特写，特意放大到相同屏幕大小，方便比较滤镜造成的明暗损失；它不是整块阴极的完整成像。&#x27;,&#x27;焦距造成的实际大小差异，在上方圆图的小框中按比例表示。长焦的小框更大，覆盖的整体天区却更小。&#x27;,&#x27;相同焦比、同一片前置滤镜、同一个天区方向，放大后的两张特写可能相同。这是模型应有的结果；焦距差异主要体现在整体视场和能否装下目标。&#x27;,&#x27;超出18 mm阴极的部分留空；完全超出时显示“此天区超出视场”，数值显示横杠，不把它误当成滤镜透过率0%。部分落入视场时，对比度只统计可见部分。&#x27;],
    intro:[&#x27;这个实验在看什么？&#x27;,&#x27;M42 就是猎户座大星云。这里借用它的外形，演示滤镜换位置、换带宽或换焦比后，星云相对天空背景会怎样变化。&#x27;,&#x27;星云发出的某些颜色特别强，窄带滤镜就像只为这些颜色开的小门。光斜着碰到滤镜时，这扇门会挪位置，原本想保留的星云光也可能被挡住。&#x27;,&#x27;图像是理想模型演示，不是不同设备实拍。这里只比较滤镜与光束角度；真实夜视器的噪声和灵敏度等没有加入。&#x27;],
    f:[&#x27;焦比 F：数字越小，光锥越宽&#x27;,&#x27;焦比 = 镜头焦距 ÷ 有效口径。例如焦距 100 mm、口径 50 mm，就是 F2。所谓“快镜”，是指 F 后面的数字小，通常能更快收集到足够的成像光量，不是光传播得更快。&#x27;,&#x27;F0.95、F1.2、F1.4 都是很快的焦比；F2.8 相比之下光锥更窄。镜头后的滤镜会接到一整束不同角度的光，光锥越宽，角度偏移通常越明显。&#x27;,&#x27;镜头前，画面中心天体的光还没有汇聚，基本正着穿过滤镜；这时减小焦比本身不会增加它的入射角。无焦模式里，这个滑块调的是望远镜焦比，最终成像焦比还取决于目镜和夜视物镜。&#x27;],
    position:[&#x27;五种位置分别在哪里？&#x27;,&#x27;直焦·镜头前：天体 → 滤镜 → 镜头 → 像面。中心天体的光近乎正入射；越偏离画面中心，光束越倾斜。&#x27;,&#x27;直焦·镜头后：天体 → 镜头 → 滤镜 → 像面。镜头已把光变成汇聚的光锥，即使画面中心，也有大量斜光穿过滤镜。这里用理想远心模型，使各处的损失相同。&#x27;,&#x27;“无焦”是保留望远镜目镜，也保留夜视仪物镜，让目镜出来的光再进入夜视仪。它不是完全没有焦点：望远镜内部先成一次像，目镜再把光变成近似平行束。&#x27;,&#x27;无焦·目镜入光端：滤镜在目镜前、望远镜汇聚光束中，常见做法是装在目镜鼻端。这里的光锥由望远镜和有效光瞳决定。&#x27;,&#x27;无焦·目镜与夜视镜头之间：滤镜接到目镜送出的近似平行光。同一个天体的光近乎平行，但视场边缘天体的整束光会斜着穿过去；角度被目镜放大过。&#x27;,&#x27;无焦·夜视镜头后：滤镜在夜视物镜之后、光电阴极之前。光又被汇聚成光锥，要按最终有效焦比计算。&#x27;],
    band:[&#x27;波段：想留下哪一种星云光？&#x27;,&#x27;Hα（读作 H alpha）：氢原子发出的 656.3 nm 红光，许多发射星云在这里很亮。&#x27;,&#x27;OIII（常读作 O 三）：失去两个电子的氧发出的光。这里以 500.7 nm 蓝绿光为通带中心，也计算附近 495.9 nm 谱线。&#x27;,&#x27;双窄：同时开两扇小门，一扇给 Hα，一扇给 OIII。带宽选 3 nm 时，每一扇门各为 3 nm；不是两扇加起来 3 nm。&#x27;,&#x27;为了只看明暗和对比，图像统一显示为灰度；灰色不代表星云原来发的是白光。&#x27;],
    width:[&#x27;带宽 nm：滤镜这扇门有多宽？&#x27;,&#x27;nm 是纳米，这里描述光的波长范围，不是滤镜玻璃的厚度。标称带宽通常指半高全宽 FWHM：透过率降到峰值一半时，两侧波长之间的间隔。边缘并不是一道完全开或关的直墙。&#x27;,&#x27;3 nm：门最窄，通常挡掉更多连续天空背景；但主线稍微偏出通带，就可能损失很大。&#x27;,&#x27;5 nm：比 3 nm 宽一些，给波段偏移多留了一点余地，也多放进一些天空背景。&#x27;,&#x27;7 nm：进一步增加容错空间；有些邻近谱线也可能被一起放进来。&#x27;,&#x27;10 nm：比 7 nm 多留一些余地，通常更耐偏移，也放进更多连续背景。&#x27;,&#x27;12 nm：比 10 nm 再宽一点，可用来观察多保留主线和多放进背景之间的取舍。&#x27;,&#x27;15 nm：主线较不容易被偏移挡掉，但邻近谱线和背景也更容易进来。&#x27;,&#x27;20 nm：通带继续加宽；画面可能更亮，星云与天空之间的反差却未必更大。&#x27;,&#x27;25 nm：通常更耐角度偏移；如果较窄通带已经能留下主线，再加宽的收益可能主要是背景变亮。&#x27;,&#x27;30 nm：这里最宽的选择，给偏移最多余地，也放进最多连续背景。“更宽”不等于画面必然更好，要一起看主线保留和背景。&#x27;,&#x27;所有档位沿用同一理想通带形状；双窄的两扇通带各为所选带宽。较宽通带可能接纳更多谱线，本演示仍只计算已列出的六条谱线和连续背景，不代表某款商品的完整实测光谱。&#x27;],
    design:[&#x27;设计焦比：优化版事先针对哪种光锥？&#x27;,&#x27;普通版在正面入射时，就把通带对准目标谱线。优化版则先把通带往较长波长方向挪一点，等斜光让它往较短波长移动时，再尽量对回来。&#x27;,&#x27;按 F0.95 / F1.2 / F1.4 设计：针对很宽的快镜光锥。按 F2 / F2.8 / F4 设计：分别针对逐渐变窄的光锥。程序为所选设计焦比寻找平均主线透过率最高的预偏置。&#x27;,&#x27;它不会自动跟随上面的实际焦比。比如镜头实际 F1.2、优化选 F2，就是在检查一片“按 F2 做的滤镜”用在 F1.2 上的效果。这个选项只改变优化版：普通/优化对比时改变右图，前后置优化或不同焦距优化对比时同时改变两图。&#x27;,&#x27;一片滤镜不能同时完美补偿所有入射角。因此优化不保证恢复 100%，也不保证在前置正入射时优于普通版。这里不是任何厂家的实测滤镜。&#x27;],
    display:[&#x27;曝光与拉伸：怎样公平地看两幅图？&#x27;,&#x27;固定曝光与拉伸：两边使用相同的收光时间和明暗显示规则。既能看到星云对比变化，也能看到实际保留的光量变化；没有分别把每张图自动调亮。&#x27;,&#x27;“拉伸”是把很暗到很亮的信号压缩到屏幕能显示的亮度范围，便于看到暗部。这里两边始终用同一条拉伸曲线。&#x27;,&#x27;统一天空亮度：额外调整显示增益，让两边的天空同样亮，便于专看星云有多突出。它只是把显示调亮或调暗，不会找回被滤镜挡掉的光子。&#x27;,&#x27;切换显示模式不会改变下方的对比保留率和主线透过率；这些百分比来自光学计算。&#x27;],
    eyepiece:[&#x27;55 / 67 mm 目镜有什么区别？&#x27;,&#x27;这里的 mm 指目镜焦距。无焦系统固定使用 26 mm F1.2 夜视物镜；换目镜会改变倍率、出瞳大小，以及最终成像焦比。&#x27;,&#x27;55 mm 目镜：倍率稍高，最终焦比通常较大。比如 F4 望远镜接 55 mm，最终约 F1.89。&#x27;,&#x27;67 mm 目镜：倍率稍低，最终焦比通常较小。同一 F4 望远镜接 67 mm，最终约 F1.55。&#x27;,&#x27;如果目镜送出的光束比夜视物镜入口还宽，多余部分进不去；最终焦比不会因此快过夜视物镜自身的 F1.2。目镜前滤镜遇到的局部光锥，也不能直接当作最终焦比。&#x27;],
    angle:[&#x27;离轴角：目标离画面正中心有多远？&#x27;,&#x27;0° 表示把目标放在系统正中心。角度越大，目标越偏向一侧，它送来的整束平行光就越斜。&#x27;,&#x27;直焦前置时，滑块表示真实天区方向相对镜头正前方的夹角；无焦两镜之间时，表示经过目镜放大后的输出角度，二者不是同一个数。&#x27;,&#x27;图中始终是 M42 的特写。滑块是在移动这块特写位于视场中的位置，不是把整片星云拉伸到几十度宽。&#x27;,&#x27;前置也不是“只有边缘一圈才偏移”：偏移随离轴角逐渐增加。后置则是在每一个场点都有光锥；这里假设理想远心，让它们受到相同影响。&#x27;],
    beam:[&#x27;平行束、光锥、半角、最终 F&#x27;,&#x27;平行束：同一个天体来的光，走向近乎一致；整束光仍可能斜着穿过滤镜。&#x27;,&#x27;光锥：镜头把光汇聚到一点，外形像一个锥体。里面有近乎正入射的光，也有角度较大的斜光。&#x27;,&#x27;半角：光锥轴线和最外侧光线之间的夹角。滤镜光锥 F 指滤镜所在位置的有效焦比，不一定等于整个系统的最终焦比。&#x27;,&#x27;最终 F：最后成像那一束光的有效焦比，用来计算相同曝光下的像面亮度。无焦系统前段和后段的光锥宽度可以不同。&#x27;,&#x27;张角：从当前位置看，这块 M42 特写覆盖多大角度；无焦时经过目镜，张角会放大。&#x27;],
    preview:[&#x27;不同预览，分别比较什么？&#x27;,&#x27;不同焦距·普通/优化：固定滤镜位置与设计，左右用不同焦距，默认25 mm和85 mm；焦比相同。上方看全视场，下方看同一天区的放大特写。&#x27;,&#x27;前置 vs 后置·普通滤镜：两边用同一片未做快镜预补偿的滤镜，只改变放置位置；直焦时左图镜头前、右图镜头后。&#x27;,&#x27;前置 vs 后置·优化滤镜：两边用同一片按选定设计焦比预补偿的滤镜，仍然只改变位置。优化片放在前面不一定更好，因为它本来是针对斜光设计的。&#x27;,&#x27;普通 vs 优化·所选位置：回到原来的比较方式，固定放置位置，左边普通、右边优化。&#x27;,&#x27;两边使用相同最终焦比、相同曝光与同一显示规则。前置可调目标离轴角；后置沿用理想远心模型，所以不会随天区位置增加额外偏移。&#x27;,&#x27;无焦时：选“目镜入光端”，比较目镜前和夜视物镜后；选另外两个无焦位置，比较夜视物镜前后。目镜入光端已在望远镜之后，也有汇聚光锥，不能把它当作直焦镜头前的平行光。&#x27;],
    compare:[&#x27;一张图，两种条件&#x27;,&#x27;先看图上方的左右标题：不同焦距模式中，左右各代表一支镜头；前后置模式中，左边是较前面的滤镜位置，右边是后置；普通/优化模式中，左边普通、右边优化。两边对应同一块星云。&#x27;,&#x27;拖动分界线，就能在相同位置来回比较。滑块移到最右边看完整左图，移到最左边看完整右图。这里只改变显示范围，不改变计算结果。&#x27;],
    normal:[&#x27;普通滤镜&#x27;,&#x27;这里指通带在正入射时对准目标主线、没有做快焦比预偏置的理想滤镜。“普通”只是模型中的设计方式，不代表做工差或某个品牌。&#x27;],
    optimized:[&#x27;快镜优化滤镜&#x27;,&#x27;在制造设计时先把通带向红侧挪一点，让斜入射造成的蓝移把它拉回目标谱线附近。&#x27;,&#x27;优化针对的是选定光锥的平均效果，不能让每一条光线都恰好通过，也不能无限补救极快焦比。&#x27;],
    contrast:[&#x27;对比度保留：星云还突出多少？&#x27;,&#x27;先算星云信号 ÷ 天空背景，再与“同样带宽、完全没有角度偏移”的理想情况比较。这里的星云信号包括谱线和少量星云连续谱。&#x27;,&#x27;例如 40% 表示星云相对天空的突出程度，只剩这个理想参考的四成；它不是说整幅画面的亮度只剩四成。&#x27;,&#x27;背景有时会和星云一起变暗，所以单看图像亮不亮，不等于判断对比度。这个数也不是信噪比，不能直接说明真实夜视仪中能看清多少细节。&#x27;,&#x27;偶尔超过 100% 并不自动表示算错：通带移动后，可能多接收某条邻近谱线。不同带宽各有自己的 100% 参考，不能只凭保留百分比判断哪种带宽的绝对对比度更高。&#x27;],
    throughput:[&#x27;主线透过：想要的光留下多少？&#x27;,&#x27;看当前选中天区的中心位置，目标主谱线的光有多少穿过滤镜。这里的中心不是一定指镜头正前方；全视场圆图另外列出光轴中心和阴极边缘。Hα 看 656.3 nm；OIII 看 500.7 nm；双窄则对两条主线按输入强度加权平均。&#x27;,&#x27;例如 25% 表示这类光子约留下四分之一。这个百分比不包含天空，也不等于整个画面、所有谱线和星光的总透过率。&#x27;,&#x27;光路动画若只演示 Hα，就只显示 Hα 的比例；双窄图像的主线百分比还包括 OIII，所以两处可能不同。&#x27;],
    reference:[&#x27;100% 是什么参考？&#x27;,&#x27;参考是一片同带宽、同通带形状的普通理想滤镜，但人为关掉入射角引起的波段偏移。它不是“完全不装滤镜”的照片。&#x27;,&#x27;在 3–30 nm 的各档位之间切换时，参考也跟着更换。保留率便于看某种滤镜受到多少损失；跨带宽比较时还要结合图像，建议用“统一天空亮度”。&#x27;],
    raymode:[&#x27;两种动画，分别回答什么？&#x27;,&#x27;不同焦距模式下，第一个动画选项改为跟随两图，同一天区方向对应相同前置入射角。线段不按镜头实际焦距比例画；实际视场与目标大小见圆图。&#x27;,&#x27;前置 vs 后置：当图像也选前后置对比时，动画与图像同步，上方对应左图，下方对应右图，包括所选普通/优化设计、离轴角和无焦位置。&#x27;,&#x27;当图像选普通 vs 优化时，前后置动画仍单独演示中心天体、同一只镜头和普通滤镜，焦比取当前最终焦比。动画上方会注明具体条件。&#x27;,&#x27;当前设置·普通 vs 优化：固定在上面选定的位置，上方普通、下方优化。无焦时会画出望远镜、目镜、夜视物镜和光电阴极。&#x27;],
    rays:[&#x27;怎样看这束光？&#x27;,&#x27;先看滤镜和物镜的先后顺序：前置滤镜接到的是还没汇聚的光；后置滤镜接到的是已经汇聚、含有多种角度的光。画面中心也有这个区别。&#x27;,&#x27;光点穿过滤镜后，越暗表示这条方向上的主线光越难通过。被大幅挡住的光会在滤镜处变淡；叉号提示主要损失的位置。颜色只区分上下两条演示，不表示光子变了颜色。&#x27;,&#x27;动画是少量代表光线，光线条数不能直接当作光量比例。标出的平均透过率来自对整个圆形光瞳的面积积分。&#x27;,&#x27;光路为非等比例示意，动画速度也不是真实光速。数字入射角来自模型计算，不可用屏幕上的线段斜率测量。播放一次后停止；系统若要求减少动画，则直接显示通过结果。&#x27;],
    components:[&#x27;物镜、目镜、像面与阴极&#x27;,&#x27;物镜：前方负责收光并成像的镜头。望远镜和夜视仪各自可以有一组物镜。&#x27;,&#x27;目镜：接在望远镜后面的放大光学组；无焦连接中，它把望远镜形成的像变成夜视物镜能接收的近似平行光。&#x27;,&#x27;像面：光最后形成清晰图像的位置，摄影时通常放传感器。&#x27;,&#x27;光电阴极（图中简称阴极）：夜视像管最前面的感光面，把到达的光转换成电子，再由像管放大。NV 是 night vision，也就是夜视。&#x27;],
    shift:[&#x27;蓝移与红向预补偿&#x27;,&#x27;这里的“蓝移”是滤镜允许通过的波长窗口往短波长方向移动；原来 656.3 nm 的光子不会被滤镜变成蓝色。&#x27;,&#x27;斜光让窗口移动后，固定波长的星云光可能落到窗口边缘甚至外面。窗口越窄，越容易受影响。&#x27;,&#x27;“红向预偏置”或“预补偿”是先把正入射窗口向长波长挪一点，给之后的蓝移留余量。“+2 nm”表示预先往长波长方向挪了 2 nm。&#x27;],
    coating:[&#x27;膜系、有效折射率、通带形状&#x27;,&#x27;干涉滤镜用多层薄膜控制哪些波长通过；这些薄膜的组合叫膜系。&#x27;,&#x27;n_eff = 2 是把复杂膜系的角度响应压缩成一个参数，叫有效折射率。它不是简单地说整块玻璃折射率为 2，也不是所有滤镜都取这个值。&#x27;,&#x27;四次超高斯是通带曲线的一种数学近似：中间较平、两侧快速但平滑下降。峰值透过 100% 是理想设定，表示在最合适的条件下，不另外扣除材料损耗。&#x27;,&#x27;极快焦比有很大的入射角，真实膜系还可能出现偏振分裂、通带变形等；这里的数值是简化演示，不能替代厂家的实测曲线。&#x27;],
    telecentric:[&#x27;远心、入瞳与全画面损失&#x27;,&#x27;“像方远心”可理解为：每个画面位置的光锥中心轴，都垂直指向像面。不是锥里的每条光线都垂直。&#x27;,&#x27;所以本模型后置时，各个画面位置看到相同的角度分布，会一起损失主线光。真实镜头如果不是远心，边缘还可能叠加更大的倾斜。&#x27;,&#x27;入瞳是从前面看进去，限制有效收光范围的“入口”。均匀入瞳表示入口每单位面积的照明相同；计算会按面积加权，圆形外圈不能和中心一点同权。&#x27;,&#x27;暗角或渐晕指边缘变暗。这里没有另外叠加机械遮挡等暗角，以免混进别的因素。&#x27;],
    pupils:[&#x27;无焦系统的光瞳匹配&#x27;,&#x27;望远镜和目镜把光送出时，会形成一小束有一定直径的出瞳；夜视物镜也有自己的入口，即入瞳。把二者对准，就像把水流对准瓶口。&#x27;,&#x27;如果出瞳比夜视入口大，外侧光进不去。模型只统计最终能够参与成像的那部分光，不把被入口截掉的光再算进滤镜效率。&#x27;,&#x27;这里固定望远镜焦距 600 mm、夜视物镜 26 mm F1.2，允许选择 55 或 67 mm 目镜。它是便于比较位置的示例配置。&#x27;],
    continuum:[&#x27;连续谱与天空背景&#x27;,&#x27;谱线像“集中在几种颜色的亮光”；连续谱则是在许多波长上都有一些光。窄带门越宽，通常就会放进越多连续背景。&#x27;,&#x27;模型把天空连续谱设为每纳米 0.005 个相对光子单位，星云连续谱设为 0.002，再乘星云形态。这些是演示用的相对数值，不对应某个光害等级。&#x27;,&#x27;真实天空还可能有很强的气辉或人造光源谱线，这里没有加入。因此不要把演示中的背景亮度直接换算成实际拍摄地点的曝光时间。&#x27;],
    weights:[&#x27;谱线权重：每种光有多少？&#x27;,&#x27;把 Hα 的输入光子数设为 1，其余谱线按相对比例给定。比如 OIII 500.7 的 0.62 表示其输入光子数约为 Hα 的 62%。&#x27;,&#x27;Hβ 是氢的另一条谱线；NII 是一次电离氮的谱线。后面的数字表示波长，单位有时写 nm，有时按 Å（埃）写；10 Å = 1 nm。&#x27;,&#x27;这里的比例是演示近似。光谱图上“峰有多高”不等于整条谱线的总光量，准确总量还要对谱线面积积分，并考虑仪器响应。&#x27;],
    limits:[&#x27;这是理想环境，省略了什么？&#x27;,&#x27;各条谱线共用同一张灰度形态，只改变通过滤镜的量；真实 M42 不同元素的亮区并不完全重合。星点也未单独建模。&#x27;,&#x27;没有加入镜头材料透过损失、像差、探测器对不同颜色的灵敏度、光子噪声或夜视像管噪声。&#x27;,&#x27;因此它适合看位置、角度、带宽和优化之间的因果关系，不用于预报某套设备能看见多少细节，也不用于评价具体品牌。&#x27;],
    scale:[&#x27;角度、角分和这张特写&#x27;,&#x27;1° 分成 60 个角分，角分写作 ′。这张图覆盖约 30′，也就是半度大小的天区，和月亮的视直径差不多。&#x27;,&#x27;离轴角表示这块天区位于视场的什么方向，不是这块天区本身有多大。无焦连接时，目镜会把它的表观角度放大。&#x27;],
    snr:[&#x27;信噪比 SNR、像差与偏振&#x27;,&#x27;信噪比是有用信号相对随机起伏有多明显；对比度是星云相对背景有多突出。背景很黑但光子太少，仍可能看不清。这里没有模拟随机噪声，不能输出真实信噪比。&#x27;,&#x27;像差是光学系统没有把光完美汇聚而造成的模糊或变形，例如彗差、色差；本演示把它们排除。&#x27;,&#x27;偏振描述光的振动方向。真实干涉滤镜在大角度下，对不同偏振的响应可能不同；本演示用单一近似曲线，不分开计算。&#x27;]
  };

      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
